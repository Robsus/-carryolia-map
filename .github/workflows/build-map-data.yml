# Builds Carryolia's map data from Geofabrik extracts. Every region (a
# country, or a part of a big country) is built on its own machine and
# published as its own release "<region>-YYYY-MM-DD-r<run>". Afterwards
# map-data.json (in the release "map-data") is rewritten to point at the
# newest release of every region.
#
# Every day at 02:17 UTC the regions whose monthly day it is are rebuilt
# (see tools/plan_regions.py), so a country's update never touches the others.
# By hand: Actions › Build map data › Run workflow, with "all", a list of
# region ids, or "plan" (only shows the plan).

name: Build map data

on:
  workflow_dispatch:
    inputs:
      regions:
        description: "today | all | plan | Geofabrik region ids (space-separated)"
        default: "plan"
      zoom:
        description: "Tile zoom level"
        default: "15"
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

# bash with pipefail: a failing command inside "cmd | tee" fails the step.
defaults:
  run:
    shell: bash

concurrency:
  group: build-map-data
  cancel-in-progress: false

env:
  # The log's key lines also go out as annotations: readable through the API without the log files.
  ANNOTATE: |
    annotate() {
      msg=$(tail -c 3500 "$3" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"}{print}')
      echo "::$1 title=$2::$msg"
    }

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.plan.outputs.regions }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: plan
        env:
          SELECT: ${{ github.event.inputs.regions || 'today' }}
        run: |
          eval "$ANNOTATE"
          python tools/plan_regions.py --select "$SELECT" --github-output "$GITHUB_OUTPUT" | tee plan.txt
          split -l 45 plan.txt planpart-
          for f in planpart-*; do annotate notice "Plan ($f)" "$f"; done

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        region: ${{ fromJson(needs.plan.outputs.regions) }}
    env:
      REGION: ${{ matrix.region.id }}
    steps:
      - uses: actions/checkout@v4

      # Only big regions need the extra room; removing this takes a few minutes.
      - name: Make room on the disk
        if: matrix.region.mb >= 400
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/julia* \
            /opt/microsoft /opt/google /usr/lib/jvm /usr/local/share/powershell /usr/local/share/chromium || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true

      - name: Pick the work disk
        run: |
          # Work where there is most room.
          root_free=$(df --output=avail -B1 / | tail -1)
          mnt_free=$(df --output=avail -B1 /mnt | tail -1)
          if [ "$mnt_free" -gt "$root_free" ]; then work=/mnt/work; else work="$HOME/work"; fi
          sudo mkdir -p "$work" && sudo chown "$USER" "$work"
          echo "WORK=$work" >> "$GITHUB_ENV"
          echo "TMPDIR=$work/tmp" >> "$GITHUB_ENV"
          mkdir -p "$work/tmp"
          df -h / /mnt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install -q osmium pmtiles orjson

      - name: Download ${{ matrix.region.id }} (${{ matrix.region.mb }} MB)
        run: |
          cd "$WORK"
          for i in 1 2 3; do
            wget -nv -U "carryolia-map-builder (github.com/${GITHUB_REPOSITORY})" "${{ matrix.region.pbf }}" -O raw.osm.pbf && break
            sleep 60
          done
          wget -nv -U "carryolia-map-builder (github.com/${GITHUB_REPOSITORY})" "${{ matrix.region.poly }}" -O "$REGION.poly"

      - name: Filter
        run: |
          cd "$WORK"
          osmium tags-filter raw.osm.pbf --expressions="$GITHUB_WORKSPACE/tools/filters.txt" -o filtered.osm.pbf --no-progress
          rm raw.osm.pbf

      - name: Build tiles
        run: |
          eval "$ANNOTATE"
          cd "$WORK"
          if ! /usr/bin/time -v python "$GITHUB_WORKSPACE/tools/build_tiles.py" filtered.osm.pbf \
              --name "$REGION" --zoom "${{ github.event.inputs.zoom || '15' }}" \
              --out-dir out --tmp-dir "$WORK/tmp" 2> build-time.txt | tee build-log.txt; then
            cat build-time.txt >> build-log.txt
            df -h / /mnt >> build-log.txt
            annotate error "Build failed: $REGION" build-log.txt
            exit 1
          fi
          grep -E "Elapsed|Maximum resident" build-time.txt | tee -a build-log.txt
          df -h "$WORK" | tail -1 | tee -a build-log.txt
          mv "$REGION.poly" out/
          rm filtered.osm.pbf
          sed -n '/=== Carryolia/,$p' build-log.txt > build-summary.txt
          annotate notice "Built: $REGION" build-summary.txt

      - name: Publish ${{ matrix.region.id }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$REGION-$(date -u +%F)-r${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$WORK"/out/*.pmtiles "$WORK/out/$REGION.summary.json" "$WORK/out/$REGION.poly" \
            --latest=false --title "Map data: ${{ matrix.region.id }} ($(date -u +%F))" \
            --notes "Carryolia map data for ${{ matrix.region.id }}, built from Geofabrik's extract. Map data © OpenStreetMap contributors, available under the Open Database License (ODbL 1.0)."
          echo "Published $tag"

  manifest:
    needs: [plan, build]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect the newest release of every region
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/plan_regions.py --select plan --out regions.json > /dev/null
          python tools/collect_releases.py --repo "$GITHUB_REPOSITORY" --regions regions.json --dist dist --keep 2 --prune
      - name: Write and publish map-data.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          eval "$ANNOTATE"
          python tools/make_manifest.py dist --repo "$GITHUB_REPOSITORY" -o map-data.json | tee manifest-log.txt
          gh release view map-data >/dev/null 2>&1 || gh release create map-data --latest=false \
            --title "Map data index (map-data.json)" \
            --notes "map-data.json lists the newest release of every region. It is rewritten after every build."
          gh release upload map-data map-data.json --clobber
          head -c 3000 status/regions.md > status-head.txt
          annotate notice "Manifest" manifest-log.txt
          annotate notice "Status" status-head.txt
      - name: Record the status (also keeps the monthly schedule alive)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/regions.md
          git diff --cached --quiet || git commit -m "Map data status after run ${GITHUB_RUN_NUMBER}"
          git pull --rebase -q origin main && git push origin HEAD:main
