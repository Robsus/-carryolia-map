# Compares a published region with Overpass (tools/compare.py): the game's own
# discovery and road queries at sample spots, answered by both.

name: Compare map data with Overpass

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty = latest)"
        default: ""
      region:
        description: "Region name (as in the file names)"
        default: "netherlands"
      points:
        description: "Number of spots"
        default: "100"
      server:
        description: "Overpass server"
        default: "https://overpass-api.de/api/interpreter"
      delay:
        description: "Seconds between Overpass requests"
        default: "5"

permissions:
  contents: read

# bash with pipefail: a failing command inside "cmd | tee" fails the step.
defaults:
  run:
    shell: bash

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q osmium pmtiles orjson
      - name: Download ${{ github.event.inputs.region }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then tag=$(gh release view --json tagName -q .tagName); fi
          echo "Release: $tag"
          gh release download "$tag" --pattern "${{ github.event.inputs.region }}*" --dir data
          ls -l data
      - name: Compare
        run: |
          annotate() {
            msg=$(tail -c 3500 "$3" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::$1 title=$2::$msg"
          }
          if ! python tools/compare.py data --region "${{ github.event.inputs.region }}" \
              --points "${{ github.event.inputs.points }}" --server "${{ github.event.inputs.server }}" \
              --delay "${{ github.event.inputs.delay }}" --report compare-report.json 2>&1 | tee compare-log.txt; then
            annotate error "Compare failed" compare-log.txt
            exit 1
          fi
          sed -n '/=== Archive vs Overpass/,/Overpass requests/p' compare-log.txt > compare-summary.txt
          annotate notice "Archive vs Overpass" compare-summary.txt
          # The differences, a few per annotation.
          sed -n '/Overpass requests/,$p' compare-log.txt | tail -n +2 > compare-diffs.txt
          split -l 12 compare-diffs.txt diffpart-
          for f in $(ls diffpart-* 2>/dev/null | head -8); do annotate warning "Differences ($f)" "$f"; done
          {
            echo '```'
            sed -n '/=== Archive vs Overpass/,$p' compare-log.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare-report
          path: compare-report.json
